name: One-shot Academy Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'one-shot academy fix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          main = Path('src/main.jsx')
          server = Path('server/index-production.mjs')
          text = main.read_text(encoding='utf-8')
          srv = server.read_text(encoding='utf-8')

          def replace_between(s, start, end, replacement):
              a = s.find(start)
              if a < 0:
                  raise SystemExit(f'Missing marker: {start}')
              b = s.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f'Missing end marker: {end}')
              return s[:a] + replacement + s[b:]

          hierarchy_fn = r'''function Hierarchy({hierarchy}){return <Page title="هيكل الأكاديمية" sub="الهيكل الرسمي للأكاديمية."><div className="hierarchyGrid">{hierarchy.map((x,i)=><div className="hierCard" key={x.id||i}>{x.image?<img src={x.image}/>:<div className="hierPlaceholder"><Shield size={34}/></div>}<div className="hierInfo"><span>{x.title}</span><b>{x.name}</b>{x.discordId&&<a className="secondary" href={`https://discord.com/users/${x.discordId}`} target="_blank" rel="noreferrer"><ExternalLink size={14}/> فتح Discord</a>}</div></div>)}{!hierarchy.length&&<div className="panel empty">لا توجد بيانات للهيكل حاليًا.</div>}</div></Page>}\n'''
          text = replace_between(text, 'function Hierarchy(', 'function Members(', hierarchy_fn)

          evaluations_fn = r'''function Evaluations({user}){const[tab,setTab]=useState('trainee'),[members,setMembers]=useState([]),[form,setForm]=useState({}),[msg,setMsg]=useState(''),[all,setAll]=useState([]),[canAll,setCanAll]=useState(false),[error,setError]=useState('');const load=async()=>{setError('');try{const d=await api('/api/academy/members');setMembers(d.members||[]);const e=await api('/api/evaluations');setAll(e.evaluations||[]);setCanAll(Boolean(e.canViewAll))}catch(e){setError(errorText(e))}};useEffect(()=>{load()},[user]);const set=(k,v)=>setForm(f=>({...f,[k]:v}));const rankKey=v=>String(v||'').trim().replace(/^ال/,'').replace(/[\s_-]+/g,' ').toLowerCase();const traineeRanks=['مستجد','جندي','جندي أول'].map(rankKey);const rankOrder=['مستجد','جندي','جندي أول','عريف','رقيب','رقيب أول','مساعد','مساعد أول','ملازم','ملازم أول','نقيب','رائد','مقدم','عقيد','عميد','لواء'].map(rankKey);const rankScore=v=>{const n=rankKey(v);const exact=rankOrder.indexOf(n);if(exact>=0)return exact+1;const found=rankOrder.findIndex(x=>n.includes(x)||x.includes(n));return found>=0?found+1:0};const trainees=members.filter(m=>traineeRanks.includes(rankKey(m.rank)));const trainers=members.filter(m=>rankScore(m.rank)>=4);const send=async(type)=>{setMsg('');try{const payload={...form,type};if(type==='trainee_to_trainer'){const target=members.find(m=>m.discordId===form.trainerId);payload.trainerName=target?.name||'';payload.toUserId=target?.discordId||'';payload.traineeName=user.police?.name||'';payload.fromName=user.police?.name||''}else{const target=members.find(m=>m.discordId===form.traineeId);payload.traineeName=target?.name||'';payload.toUserId=target?.discordId||'';payload.trainerName=user.police?.name||''}await api('/api/evaluations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});setMsg('تم حفظ التقييم بنجاح.');setForm({});await load()}catch(e){setMsg(errorText(e))}};if(error)return <Page title="التقييمات الأكاديمية" sub="تقييم المتدربين والمدربين."><div className="panel empty"><p>{error}</p><Retry onClick={load}/></div></Page>;return <Page title="التقييمات الأكاديمية" sub="تقييم المتدربين والمدربين بسجل واضح ومستقل."><div className="adminTabs"><button className={tab==='trainee'?'active':''} onClick={()=>{setTab('trainee');setMsg('');setForm({})}}>تقييم المتدرب</button><button className={tab==='trainer'?'active':''} onClick={()=>{setTab('trainer');setMsg('');setForm({})}}>تقييم المدرب</button></div>{tab==='trainee'&&<div className="panel formPanel"><h2>تقييم المتدرب للمدرب</h2><label>اسم المتدرب</label><input value={user.police?.name||''} readOnly/><label>اسم المدرب *</label><select value={form.trainerId||''} onChange={e=>set('trainerId',e.target.value)}><option value="">اختر المدرب</option>{trainers.map(m=><option key={m.discordId} value={m.discordId}>{m.name} — {m.rank||'—'}</option>)}</select><label>عدد ساعات التدريب *</label><input value={form.trainingHours||''} onChange={e=>set('trainingHours',e.target.value)} placeholder="مثال: 8"/><label>ما هي الحالات التي باشرت فيها ؟ *</label><textarea value={form.cases||''} onChange={e=>set('cases',e.target.value)}/><label>كيف ترى المدرب من وجهة نظرك ؟ *</label><textarea value={form.trainerView||''} onChange={e=>set('trainerView',e.target.value)}/><label>هل كان المدرب واضحاً في التدريب ؟ *</label><textarea value={form.clarity||''} onChange={e=>set('clarity',e.target.value)}/><label>هل لديك أي ملاحظات في التدريب ؟ *</label><textarea value={form.trainingNotes||''} onChange={e=>set('trainingNotes',e.target.value)}/><label>هل لديك أي ملاحظات على المدرب ؟ *</label><textarea value={form.trainerNotes||''} onChange={e=>set('trainerNotes',e.target.value)}/><label>تحب تطلع مع نفس المدرب تاني ؟ *</label><div className="options"><label><input type="radio" name="same" checked={form.sameTrainer==='نعم'} onChange={()=>set('sameTrainer','نعم')}/><span>نعم</span></label><label><input type="radio" name="same" checked={form.sameTrainer==='لا'} onChange={()=>set('sameTrainer','لا')}/><span>لا</span></label></div><label>قيم المدرب *</label><Rating id="trainer-rating" value={form.rating||''} setValue={v=>set('rating',v)}/><button className="primary" onClick={()=>send('trainee_to_trainer')}><Save size={16}/> إرسال التقييم</button>{msg&&<div className={msg.startsWith('تم')?'successBox':'errorBox'}>{msg}</div>}</div>}{tab==='trainer'&&<div className="panel formPanel"><h2>تقييم المدرب للمتدرب</h2><label>اسم المتدرب *</label><select value={form.traineeId||''} onChange={e=>set('traineeId',e.target.value)}><option value="">اختر المتدرب</option>{trainees.map(m=><option key={m.discordId} value={m.discordId}>{m.name} — {m.rank||'—'}</option>)}</select><label>تقييم المتدرب *</label><Rating id="trainee-rating" value={form.rating||''} setValue={v=>set('rating',v)}/><button className="primary" onClick={()=>send('trainer_to_trainee')}><Save size={16}/> حفظ التقييم</button>{msg&&<div className={msg.startsWith('تم')?'successBox':'errorBox'}>{msg}</div>}</div>}{canAll&&<EvaluationLog evaluations={all}/>}</Page>}\nfunction EvaluationLog({evaluations}){const[open,setOpen]=useState(null);return <div className="panel"><div className="panelHead"><h2>سجل التقييمات</h2><span className="ok">{evaluations.length} تقييم</span></div>{evaluations.map(e=><div className="evaluationCard" key={e.id}><button className="evaluationHead" onClick={()=>setOpen(open===e.id?null:e.id)}><div><strong>{e.type==='trainee_to_trainer'?'تقييم متدرب للمدرب':'تقييم مدرب للمتدرب'}</strong><small>المقيّم: {e.fromName||'—'} · {fmt(e.createdAt)}</small><small>المستهدف: {e.type==='trainee_to_trainer'?(e.trainerName||'—'):(e.traineeName||'—')}</small></div><span className="ok">{e.rating}/10</span></button>{open===e.id&&<div className="evaluationDetails"><p><b>عدد ساعات التدريب:</b> {e.trainingHours||'—'}</p><p><b>الحالات:</b> {e.cases||'—'}</p><p><b>وجهة النظر:</b> {e.trainerView||'—'}</p><p><b>وضوح التدريب:</b> {e.clarity||'—'}</p><p><b>ملاحظات التدريب:</b> {e.trainingNotes||'—'}</p><p><b>ملاحظات على المدرب:</b> {e.trainerNotes||'—'}</p><p><b>نفس المدرب مرة أخرى:</b> {e.sameTrainer||'—'}</p></div>}</div>)}{!evaluations.length&&<div className="emptyMini">لا توجد تقييمات حتى الآن.</div>}</div>}\n'''
          text = replace_between(text, 'function Evaluations(', 'function Exams(', evaluations_fn)

          admin_app_fn = r'''function AdminApplications({state,reload,setMsg}){const[questions,setQuestions]=useState(state.applicationQuestions||[]),[batch,setBatch]=useState({name:'',startAt:'',endAt:''}),[open,setOpen]=useState(null);const save=async()=>{try{await api('/api/admin/application',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({questions})});setMsg('تم حفظ أسئلة التقديم.');reload()}catch(e){setMsg(errorText(e))}};const create=async()=>{try{await api('/api/admin/batches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(batch)});setBatch({name:'',startAt:'',endAt:''});setMsg('تم إنشاء الدفعة.');reload()}catch(e){setMsg(errorText(e))}};const patch=async b=>{try{await api(`/api/admin/batches/${b.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});setMsg('تم تحديث الدفعة.');reload()}catch(e){setMsg(errorText(e))}};const review=async(a,status)=>{try{await api(`/api/admin/applications/${a.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,note:a.reviewNote||''})});setMsg('تم تحديث حالة التقديم.');reload()}catch(e){setMsg(errorText(e))}};const remove=async id=>{if(!confirm('حذف هذا التقديم نهائيًا؟'))return;try{await api(`/api/admin/applications/${id}`,{method:'DELETE'});setMsg('تم حذف التقديم.');reload()}catch(e){setMsg(errorText(e))}};return <div className="adminSection"><div className="panel"><h2>طلبات التقديم</h2>{state.applications.map(a=><div className="applicationAdminCard" key={a.id}><div className="applicationRow"><div><strong>{a.name||'متقدم'}</strong><small>Discord: {a.discordId} · {fmt(a.submittedAt)} · الدفعة: {state.batches.find(b=>b.id===a.batchId)?.name||'—'}</small></div><span className="status">{a.status}</span><button className="secondary" onClick={()=>setOpen(open===a.id?null:a.id)}>{open===a.id?'إخفاء':'عرض'}</button><button className="danger" onClick={()=>remove(a.id)}><Trash2 size={15}/></button></div>{open===a.id&&<div className="applicationDetails">{state.applicationQuestions.map(q=><div key={q.id}><b>{q.text}</b><p>{String(a.answers?.[q.id]??'—')}</p></div>)}<textarea defaultValue={a.reviewNote||''} placeholder="ملاحظة المراجعة" onChange={e=>{a.reviewNote=e.target.value}}/><div className="actions"><button className="primary" onClick={()=>review(a,'accepted')}>قبول</button><button className="secondary" onClick={()=>review(a,'waitlist')}>قائمة انتظار</button><button className="secondary" onClick={()=>review(a,'rejected')}>رفض</button></div></div>}</div>)}{!state.applications.length&&<div className="emptyMini">لا توجد تقديمات حاليًا.</div>}</div><div className="panel"><h2>الدفعات ومواعيد التقديم</h2><div className="formGrid"><input value={batch.name} onChange={e=>setBatch({...batch,name:e.target.value})} placeholder="اسم الدفعة"/><input type="datetime-local" value={batch.startAt} onChange={e=>setBatch({...batch,startAt:e.target.value})}/><input type="datetime-local" value={batch.endAt} onChange={e=>setBatch({...batch,endAt:e.target.value})}/><button className="primary" onClick={create}><Plus size={16}/> إنشاء دفعة</button></div>{state.batches.map(b=><div className="applicationRow" key={b.id}><div><strong>{b.name}</strong><small>من {fmt(b.startAt)} إلى {fmt(b.endAt)}</small></div><span className="status">{b.status}</span><button className="secondary" onClick={()=>patch({...b,status:b.status==='open'?'closed':'open'})}>{b.status==='open'?'إغلاق':'فتح'}</button></div>)}</div><div className="panel"><h2>أسئلة التقديم</h2>{questions.map((x,i)=><div className="questionAdmin" key={x.id}><input value={x.text} onChange={e=>setQuestions(a=>a.map((z,j)=>j===i?{...z,text:e.target.value}:z))}/><select value={x.type} onChange={e=>setQuestions(a=>a.map((z,j)=>j===i?{...z,type:e.target.value}:z))}><option value="text">نصي</option><option value="choice">اختيارات</option><option value="yesno">نعم / لا</option></select><button className="danger" onClick={()=>setQuestions(a=>a.filter((_,j)=>j!==i))}><Trash2 size={15}/></button></div>)}<button className="secondary" onClick={()=>setQuestions(a=>[...a,{id:`q-${Date.now()}`,text:'سؤال جديد',type:'text',options:[],required:true,points:1}])}><Plus size={16}/> إضافة سؤال</button><button className="primary" onClick={save}><Save size={16}/> حفظ الأسئلة</button></div></div>}\n'''
          text = replace_between(text, 'function AdminApplications(', 'function AdminExams(', admin_app_fn)

          admin_exam_fn = r'''function AdminExams({state,reload,setMsg}){const[editing,setEditing]=useState(null);const blank={title:'اختبار جديد',description:'',stage:'عام',passingScore:60,durationMinutes:30,attemptsAllowed:1,startAt:'',endAt:'',active:true,questions:[]};const save=async()=>{try{const isNew=editing.id.startsWith('new-');await api(isNew?'/api/admin/exams':`/api/admin/exams/${editing.id}`,{method:isNew?'POST':'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(editing)});setMsg('تم حفظ الاختبار.');setEditing(null);reload()}catch(e){setMsg(errorText(e))}};const toggle=async e=>{try{await api(`/api/admin/exams/${e.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...e,active:!e.active})});setMsg(e.active?'تم تعطيل الاختبار.':'تم تفعيل الاختبار.');reload()}catch(x){setMsg(errorText(x))}};const remove=async id=>{if(!confirm('حذف الاختبار نهائيًا؟'))return;try{await api(`/api/admin/exams/${id}`,{method:'DELETE'});setMsg('تم حذف الاختبار.');reload()}catch(e){setMsg(errorText(e))}};const updateQ=(i,k,v)=>setEditing({...editing,questions:editing.questions.map((q,j)=>j===i?{...q,[k]:v}:q)});const addQ=()=>setEditing({...editing,questions:[...editing.questions,{id:`q-${Date.now()}`,text:'سؤال جديد',type:'yesno',options:['نعم','لا'],correct:'نعم',explanation:'',points:1}]});return <div className="adminSection"><div className="panel"><div className="panelHead"><h2>الاختبارات</h2><button className="primary" onClick={()=>setEditing({...blank,id:`new-${Date.now()}`})}><Plus size={16}/> اختبار جديد</button></div>{state.exams.map(e=><div className="examAdminRow" key={e.id}><div><strong>{e.title}</strong><small>{e.questions.length} سؤال · {e.durationMinutes} دقيقة · {fmt(e.startAt)} → {fmt(e.endAt)}</small></div><span className={e.active?'openBadge':'closedBadge'}>{e.active?'مفتوح/منشور':'معطل'}</span><button className="secondary" onClick={()=>toggle(e)}>{e.active?'تعطيل':'تفعيل'}</button><button className="secondary" onClick={()=>setEditing({...e})}>تعديل</button><button className="danger" onClick={()=>remove(e.id)}><Trash2 size={15}/></button></div>)}</div>{editing&&<div className="panel examEditor"><h2>إعداد الاختبار</h2><div className="formGrid"><input value={editing.title} onChange={e=>setEditing({...editing,title:e.target.value})} placeholder="عنوان الاختبار"/><input type="number" value={editing.passingScore} onChange={e=>setEditing({...editing,passingScore:Number(e.target.value)})} placeholder="درجة النجاح %"/><input type="number" value={editing.durationMinutes} onChange={e=>setEditing({...editing,durationMinutes:Number(e.target.value)})} placeholder="مدة الاختبار بالدقائق"/><input type="number" value={editing.attemptsAllowed||1} onChange={e=>setEditing({...editing,attemptsAllowed:Number(e.target.value)})} placeholder="عدد المحاولات"/><input type="datetime-local" value={editing.startAt||''} onChange={e=>setEditing({...editing,startAt:e.target.value})}/><input type="datetime-local" value={editing.endAt||''} onChange={e=>setEditing({...editing,endAt:e.target.value})}/></div><label className="switchLine"><input type="checkbox" checked={editing.active!==false} onChange={e=>setEditing({...editing,active:e.target.checked})}/> الاختبار منشور ومتاح</label><textarea value={editing.description||''} onChange={e=>setEditing({...editing,description:e.target.value})} placeholder="وصف الاختبار"/>{editing.questions.map((q,i)=><div className="examQuestionEdit" key={q.id||i}><div className="questionAdminHead"><b>السؤال {i+1}</b><button className="danger" onClick={()=>setEditing({...editing,questions:editing.questions.filter((_,j)=>j!==i)})}><Trash2 size={15}/></button></div><input value={q.text||''} onChange={e=>updateQ(i,'text',e.target.value)} placeholder="نص السؤال"/><select value={q.type||'yesno'} onChange={e=>{const t=e.target.value;updateQ(i,'type',t);if(t==='yesno'){setEditing(x=>({...x,questions:x.questions.map((z,j)=>j===i?{...z,type:t,options:['نعم','لا'],correct:'نعم'}:z)}))}}}><option value="yesno">نعم / لا</option><option value="choice">اختيارات متعددة</option></select>{q.type==='choice'&&<textarea value={(q.options||[]).join('\n')} onChange={e=>updateQ(i,'options',e.target.value.split('\n').map(x=>x.trim()).filter(Boolean))} placeholder="كل اختيار في سطر"/>}<input value={q.correct||''} onChange={e=>updateQ(i,'correct',e.target.value)} placeholder="الإجابة الصحيحة"/><textarea value={q.explanation||''} onChange={e=>updateQ(i,'explanation',e.target.value)} placeholder="شرح الإجابة / ملاحظة تظهر في سجل الاختبار"/></div>)}<button className="secondary" onClick={addQ}><Plus size={16}/> إضافة سؤال</button><div className="actions"><button className="primary" onClick={save}><Save size={16}/> حفظ الاختبار</button><button className="secondary" onClick={()=>setEditing(null)}>إلغاء</button></div></div>}</div>}\n'''
          text = replace_between(text, 'function AdminExams(', 'function AdminMembers(', admin_exam_fn)

          admin_hierarchy_fn = r'''function AdminHierarchy({state,reload,setHierarchy,setMsg,can}){const[items,setItems]=useState(state.hierarchy||[]);useEffect(()=>setItems(state.hierarchy||[]),[state.hierarchy]);const up=(i,k,v)=>setItems(a=>a.map((x,j)=>j===i?{...x,[k]:v}:x));const upload=async(i,file)=>{if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),max=360,s=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));const data=c.toDataURL('image/jpeg',.72);if(data.length>48000){setMsg('الصورة كبيرة؛ اختر صورة أصغر.');return}up(i,'image',data)};img.src=reader.result};reader.readAsDataURL(file)};const save=async()=>{try{const d=await api('/api/admin/hierarchy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});setHierarchy(d.hierarchy);setMsg('تم حفظ الهيكل.');reload()}catch(e){setMsg(errorText(e))}};if(!can('manage_hierarchy'))return <div className="panel empty"><LockKeyhole/><h2>لا تملك صلاحية تعديل الهيكل</h2></div>;return <div className="panel"><div className="panelHead"><h2>هيكل الأكاديمية</h2><button className="primary" onClick={save}><Save size={15}/> حفظ</button></div>{items.map((x,i)=><div className="hierEdit" key={x.id}><div className="preview">{x.image?<img src={x.image}/>:<Shield/>}<label className="upload"><Upload size={14}/> صورة<input type="file" accept="image/png,image/jpeg,image/webp" onChange={e=>upload(i,e.target.files?.[0])}/></label>{x.discordId&&<a className="secondary" href={`https://discord.com/users/${x.discordId}`} target="_blank" rel="noreferrer"><ExternalLink size={14}/> Discord</a>}</div><div className="editFields"><input value={x.title} onChange={e=>up(i,'title',e.target.value)}/><input value={x.name} onChange={e=>up(i,'name',e.target.value)}/><input value={x.discordId} onChange={e=>up(i,'discordId',e.target.value)} placeholder="Discord User ID"/></div></div>)}</div>}\n'''
          text = replace_between(text, 'function AdminHierarchy(', 'function AdminEvaluations(', admin_hierarchy_fn)

          admin_eval_fn = r'''function AdminEvaluations({state}){return <EvaluationLog evaluations={state.evaluations||[]}/>}\n'''
          text = replace_between(text, 'function AdminEvaluations(', 'function AdminSettings(', admin_eval_fn)

          # Add a small responsive helper class hook; existing CSS handles most layout.
          main.write_text(text, encoding='utf-8')

          # Server: replace Google Sheets transport with authenticated REST calls to avoid malformed timeout payloads.
          old = srv
          start = srv.find('async function creds()')
          end = srv.find('function hidx(', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate Google transport block')
          google_block = r'''async function creds(){if(credentials)return credentials;const raw=String(process.env.GOOGLE_SERVICE_ACCOUNT_JSON||'').trim()||await fs.readFile(SERVICE_FILE,'utf8');credentials=JSON.parse(raw);return credentials}
async function accessToken(){const auth=new google.auth.GoogleAuth({credentials:await creds(),scopes:['https://www.googleapis.com/auth/spreadsheets']});const t=await auth.getAccessToken();return typeof t==='string'?t:(t?.token||'')}
async function sheetsRequest(url,options={}){const token=await accessToken();const r=await fetch(url,{...options,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(options.headers||{})},signal:options.signal||AbortSignal.timeout(15000)});const raw=await r.text();let body={};try{body=raw?JSON.parse(raw):{}}catch{body={raw}}if(!r.ok)throw new Error(body?.error?.message||body?.error||raw||`Google Sheets HTTP ${r.status}`);return body}
'''
          srv = srv[:start] + google_block + srv[end:]

          # Replace police() with direct REST.
          a=srv.find('async function police('); b=srv.find('async function ensureData(',a)
          if a<0 or b<0: raise SystemExit('Could not locate police block')
