name: Restore main.jsx after accidental overwrite
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-main-after-refactor.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore main.jsx from known-good commit
        run: |
          git checkout 1f12bdd03aa950099c9aa0cb69063c26bed3c073^ -- src/main.jsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.jsx
          git commit -m "Restore main.jsx after accidental overwrite" || exit 0
          git push
