name: One-time DATA sheet fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch ensureData
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/index-production.mjs')
          s = p.read_text(encoding='utf-8')
          old = "if(!(m.data.sheets||[]).some(x=>x.properties?.title===DATA_SHEET))await s.spreadsheets.batchUpdate({spreadsheetId:DATA_SHEET_ID,requestBody:{requests:[{addSheet:{properties:{title:DATA_SHEET}}}]}})"
          new = "if(!(m.data.sheets||[]).some(x=>x.properties?.title===DATA_SHEET)){try{await s.spreadsheets.batchUpdate({spreadsheetId:DATA_SHEET_ID,requestBody:{requests:[{addSheet:{properties:{title:DATA_SHEET}}}]}})}catch(e){if(!String(e?.message||e).includes('already exists'))throw e}}"
          if old not in s:
              raise SystemExit('Expected ensureData pattern not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('ensureData patched successfully')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/one-time-data-sheet-fix.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/index-production.mjs .github/workflows/one-time-data-sheet-fix.yml
          git commit -m 'fix: handle pre-existing DATA sheet safely [skip ci]'
          git push